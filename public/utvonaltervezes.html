<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vallorSoft — Planificator rute</title>
  <link rel="apple-touch-icon" href="/icon192.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="/session-guard.js?v=20260722sess"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; height:100%; font-family: 'Inter', system-ui, sans-serif; color:#0f172a; background:#f8fafc; }
    button, input { font-family: inherit; color: inherit; }

    /* ===== SHELL ===== */
    #shell { position:relative; width:100%; height:100vh; overflow:hidden; }
    #map { position:absolute; inset:0; z-index:1; }

    /* ===== TOP PANEL (kereső + köztes pontok, a térkép FÖLÖTT) ===== */
    #topPanel {
      position:absolute; top:14px; left:14px; z-index:1000;
      width: 460px; max-width: calc(100% - 28px);
      background:#ffffff; color:#0f172a;
      border:1px solid #e2e8f0; border-radius:14px;
      box-shadow: 0 20px 45px -18px rgba(15,23,42,0.28), 0 6px 14px -8px rgba(15,23,42,0.14);
      padding:14px 14px 12px;
    }
    .tp-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
    .tp-head .brand { font-size:16px; font-weight:800; letter-spacing:-0.02em; color:#0f172a; }
    .tp-head .brand .soft { color:#4f46e5; }
    .tp-head .back { margin-left:auto; padding:6px 10px; border:1px solid #cbd5e1; border-radius:8px; font-size:12px; color:#334155; background:#fff; cursor:pointer; text-decoration:none; }
    .tp-head .back:hover { background:#f1f5f9; }

    /* Pontok lista */
    .wp-list { display:flex; flex-direction:column; gap:7px; }
    .wp-row { position:relative; display:flex; align-items:stretch; gap:8px; }
    .wp-pin { flex:0 0 28px; text-align:center; padding-top:9px; font-size:18px; }
    .wp-input-wrap { flex:1; position:relative; }
    .wp-input {
      width:100%; padding:10px 34px 10px 12px;
      border:1.5px solid #cbd5e1; border-radius:10px;
      font-size:14px; font-weight:500;
      background:#ffffff; color:#0f172a;
      outline:none; transition:border-color 0.15s, box-shadow 0.15s;
    }
    .wp-input:focus { border-color:#4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.15); }
    .wp-input::placeholder { color:#94a3b8; font-weight:400; }
    .wp-clear { position:absolute; right:6px; top:6px; width:26px; height:26px; border:0; background:transparent; color:#94a3b8; font-size:16px; cursor:pointer; border-radius:6px; }
    .wp-clear:hover { background:#fee2e2; color:#dc2626; }

    /* Autocomplete lenyíló */
    .wp-ac {
      position:absolute; top: calc(100% + 3px); left:0; right:0;
      background:#ffffff; color:#0f172a;
      border:1px solid #cbd5e1; border-radius:10px;
      max-height:280px; overflow:auto; z-index:1200;
      box-shadow: 0 20px 40px -14px rgba(15,23,42,0.32);
      display:none;
    }
    .wp-ac.open { display:block; }
    .wp-ac-item { padding:9px 12px; cursor:pointer; border-bottom:1px solid #f1f5f9; }
    .wp-ac-item:last-child { border-bottom:0; }
    .wp-ac-item:hover { background:#eef2ff; }
    .wp-ac-item .t { font-weight:600; color:#0f172a; font-size:13.5px; }
    .wp-ac-item .s { color:#475569; font-size:12px; margin-top:1px; }

    /* Gombok */
    .btn-row { display:flex; gap:8px; margin-top:10px; }
    .add-wp {
      padding:9px 12px; border-radius:10px;
      border:1px dashed #94a3b8; background:transparent;
      color:#334155; font-size:13px; font-weight:500;
      cursor:pointer; width:100%; margin-top:8px;
    }
    .add-wp:hover { border-color:#4f46e5; color:#4f46e5; background:#f5f3ff; }
    .btn {
      padding:11px 14px; border-radius:10px; border:1.5px solid #cbd5e1;
      background:#ffffff; color:#0f172a; font-weight:700; font-size:13.5px;
      cursor:pointer; transition:all 0.15s;
    }
    .btn:hover { border-color:#94a3b8; background:#f8fafc; }
    .btn.primary {
      flex:1;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color:#ffffff; border-color:#4f46e5;
      box-shadow: 0 8px 22px -8px rgba(79,70,229,0.55);
    }
    .btn.primary:hover { background: linear-gradient(135deg, #4338ca, #5b5ff0); }
    .btn.primary:disabled { opacity:0.5; cursor:not-allowed; box-shadow:none; }

    .err-note {
      margin-top:10px; padding:10px 12px; border-radius:9px;
      background:#fee2e2; border:1px solid #fca5a5; color:#991b1b;
      font-size:13px; font-weight:600;
    }

    /* ===== BOTTOM PANEL (eredmény a térkép alján) ===== */
    #bottomPanel {
      position:absolute; left:14px; right:14px; bottom:14px; z-index:900;
      background:#ffffff; color:#0f172a;
      border:1px solid #e2e8f0; border-radius:14px;
      box-shadow: 0 -18px 45px -18px rgba(15,23,42,0.24), 0 6px 14px -8px rgba(15,23,42,0.14);
      padding:14px 16px;
      max-height: 42vh; overflow:auto;
      display:none;
    }
    #bottomPanel.show { display:block; }
    .bp-head { display:flex; align-items:center; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
    .bp-head h2 { font-size:14px; font-weight:800; text-transform:uppercase; letter-spacing:0.05em; color:#334155; margin:0; }
    .bp-src {
      margin-left:auto; padding:4px 10px; border-radius:99px;
      background:#eef2ff; color:#4338ca; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em;
    }
    .bp-src.osrm { background:#fef3c7; color:#78350f; }
    .kpi-row { display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; margin-bottom:12px; }
    @media (max-width: 720px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
    .kpi { background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:10px 12px; }
    .kpi .k { font-size:11px; color:#64748b; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:3px; font-weight:600; }
    .kpi .v { font-size:19px; font-weight:800; color:#0f172a; letter-spacing:-0.01em; }
    .cc-table { width:100%; border-collapse:collapse; font-size:13.5px; background:#fff; border-radius:10px; overflow:hidden; border:1px solid #e2e8f0; }
    .cc-table th { text-align:left; padding:9px 12px; background:#f1f5f9; color:#334155; font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; border-bottom:1px solid #e2e8f0; }
    .cc-table td { padding:9px 12px; border-top:1px solid #f1f5f9; color:#0f172a; }
    .cc-table tr:hover td { background:#f8fafc; }
    .cc-table td.num { text-align:right; font-variant-numeric: tabular-nums; font-weight:600; }
    .cc-flag { display:inline-block; width:22px; text-align:center; margin-right:8px; }
    .info-note { margin-top:10px; padding:10px 12px; border-radius:9px; background:#fef3c7; border:1px solid #fcd34d; color:#78350f; font-size:12.5px; font-weight:500; }

    /* Spinner */
    #spin { position:absolute; inset:0; z-index:1400; background:rgba(255,255,255,0.55); display:none; align-items:center; justify-content:center; }
    #spin.on { display:flex; }
    #spin div { width:48px; height:48px; border:5px solid #e0e7ff; border-top-color:#4f46e5; border-radius:50%; animation:sp 0.8s linear infinite; }
    @keyframes sp { to { transform:rotate(360deg); } }

    /* Mobil optimalizálás */
    @media (max-width: 640px) {
      #topPanel { top:10px; left:10px; right:10px; width:auto; max-width:none; padding:12px; }
      #bottomPanel { left:10px; right:10px; bottom:10px; padding:12px; max-height:48vh; }
      .tp-head .brand { font-size:15px; }
    }
  </style>
</head>
<body>

<div id="shell">
  <div id="map"></div>

  <!-- TOP: kereső + köztes pontok -->
  <section id="topPanel">
    <div class="tp-head">
      <div class="brand">vallor<span class="soft">Soft</span></div>
      <a href="/admin" class="back">← Înapoi</a>
    </div>

    <div id="wpList" class="wp-list"></div>
    <button class="add-wp" onclick="addWaypoint()">+ Adaugă punct intermediar</button>

    <div class="btn-row">
      <button class="btn" onclick="resetAll()" style="flex:0 0 auto;">↻ Reset</button>
      <button id="planBtn" class="btn primary" onclick="planRoute()" disabled>🗺 Calculează traseu</button>
    </div>

    <div id="err" class="err-note" style="display:none;"></div>
  </section>

  <!-- BOTTOM: eredmény -->
  <section id="bottomPanel">
    <div class="bp-head">
      <h2>📊 Rezultat</h2>
      <span id="kpiSrc" class="bp-src">—</span>
    </div>
    <div class="kpi-row">
      <div class="kpi"><div class="k">Distanță totală</div><div class="v" id="kpiKm">—</div></div>
      <div class="kpi"><div class="k">Timp estimat</div><div class="v" id="kpiTime">—</div></div>
      <div class="kpi"><div class="k">Taxă de drum</div><div class="v" id="kpiToll">—</div></div>
      <div class="kpi"><div class="k">Puncte pe traseu</div><div class="v" id="kpiPts">—</div></div>
    </div>
    <table class="cc-table" id="ccTable">
      <thead><tr><th>Țară</th><th style="text-align:right;">Km</th><th style="text-align:right;">Taxă drum</th></tr></thead>
      <tbody id="ccBody"></tbody>
    </table>
    <div id="infoNote" class="info-note" style="display:none;"></div>
  </section>

  <div id="spin"><div></div></div>
</div>

<script>
// ===== Segéd =====
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function debounce(fn, ms){ let t; return function(){ const a=arguments, ctx=this; clearTimeout(t); t=setTimeout(()=>fn.apply(ctx,a), ms); }; }
async function gas(functionName, args){
  const r = await fetch('/api/execute', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ functionName, arguments: args||{} }), credentials:'same-origin' });
  const j = await r.json().catch(()=>({}));
  return (j && j.result) || {};
}

// ===== Zászló-emoji országkódból =====
const CC3 = { ROU:'RO', HUN:'HU', DEU:'DE', AUT:'AT', ITA:'IT', FRA:'FR', ESP:'ES', PRT:'PT', BEL:'BE', NLD:'NL', LUX:'LU', CHE:'CH', POL:'PL', CZE:'CZ', SVK:'SK', SVN:'SI', HRV:'HR', SRB:'RS', BGR:'BG', GRC:'GR', TUR:'TR', UKR:'UA', MDA:'MD', BLR:'BY', LTU:'LT', LVA:'LV', EST:'EE', FIN:'FI', SWE:'SE', NOR:'NO', DNK:'DK', GBR:'GB', IRL:'IE', BIH:'BA', MKD:'MK', ALB:'AL', MNE:'ME', KOS:'XK' };
const CC_NAME = { RO:'România', HU:'Ungaria', DE:'Germania', AT:'Austria', IT:'Italia', FR:'Franța', ES:'Spania', PT:'Portugalia', BE:'Belgia', NL:'Olanda', LU:'Luxemburg', CH:'Elveția', PL:'Polonia', CZ:'Cehia', SK:'Slovacia', SI:'Slovenia', HR:'Croația', RS:'Serbia', BG:'Bulgaria', GR:'Grecia', TR:'Turcia', UA:'Ucraina', MD:'Moldova', BY:'Belarus', LT:'Lituania', LV:'Letonia', EE:'Estonia', FI:'Finlanda', SE:'Suedia', NO:'Norvegia', DK:'Danemarca', GB:'Marea Britanie', IE:'Irlanda', BA:'Bosnia', MK:'Macedonia', AL:'Albania', ME:'Muntenegru', XK:'Kosovo' };
function ccNorm(cc){ if (!cc) return '??'; const s = String(cc).toUpperCase(); return CC3[s] || s.slice(0,2); }
function flagEmoji(cc){
  const c = ccNorm(cc); if (c.length !== 2 || c === '??') return '🏳';
  const A = 0x1F1E6, base = 'A'.charCodeAt(0);
  return String.fromCodePoint(A + (c.charCodeAt(0)-base)) + String.fromCodePoint(A + (c.charCodeAt(1)-base));
}
function ccName(cc){ const c = ccNorm(cc); return CC_NAME[c] || c; }

// ===== Térkép =====
const map = L.map('map', { zoomControl:true }).setView([46.5, 20.0], 5);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors, &copy; CARTO', subdomains: 'abcd',
}).addTo(map);
let routeLayer = null;
let markerLayer = L.layerGroup().addTo(map);

// ===== Állapot =====
function nid(){ return 'w' + Math.random().toString(36).slice(2,9); }
let waypoints = [
  { id: nid(), label:'', lat:null, lng:null },
  { id: nid(), label:'', lat:null, lng:null },
];

function render(){
  const box = document.getElementById('wpList');
  const arr = [];
  waypoints.forEach((w, i) => {
    const pin = i===0 ? '🟢' : (i===waypoints.length-1 ? '🔴' : '🟡');
    const canDel = waypoints.length > 2 && i>0 && i<waypoints.length-1; // csak köztespont törölhető
    const ph = i===0 ? 'Punct de plecare' : (i===waypoints.length-1 ? 'Destinație' : 'Punct intermediar');
    arr.push(
      '<div class="wp-row" data-id="'+w.id+'">'
      + '<div class="wp-pin">'+pin+'</div>'
      + '<div class="wp-input-wrap">'
      +   '<input class="wp-input" id="in_'+w.id+'" placeholder="'+ph+'" value="'+esc(w.label||'')+'" autocomplete="off">'
      +   (canDel ? '<button class="wp-clear" data-id="'+w.id+'" title="Elimină">✕</button>' : '')
      +   '<div class="wp-ac" id="ac_'+w.id+'"></div>'
      + '</div>'
      + '</div>'
    );
  });
  box.innerHTML = arr.join('');
  waypoints.forEach((w) => attach(w));
  updatePlanBtn();
}

function attach(w){
  const inp = document.getElementById('in_'+w.id);
  const dd  = document.getElementById('ac_'+w.id);
  if (!inp) return;
  const doSearch = debounce(async () => {
    const q = inp.value.trim();
    w.label = inp.value;
    w.lat = null; w.lng = null;
    updatePlanBtn();
    if (q.length < 2){ dd.classList.remove('open'); dd.innerHTML=''; return; }
    const r = await gas('rpAcSearch', { q });
    if (!r.ok || !Array.isArray(r.items) || !r.items.length){ dd.classList.remove('open'); dd.innerHTML=''; return; }
    dd.innerHTML = r.items.map((it, idx) =>
      '<div class="wp-ac-item" data-idx="'+idx+'"><div class="t">'+esc(it.title||it.label)+'</div>'
      + (it.label && it.label !== it.title ? '<div class="s">'+esc(it.label)+'</div>' : '')
      + '</div>'
    ).join('');
    dd.classList.add('open');
    dd._items = r.items;
  }, 220);
  inp.addEventListener('input', doSearch);
  inp.addEventListener('blur', () => setTimeout(() => dd.classList.remove('open'), 200));
  inp.addEventListener('focus', () => { if (dd.innerHTML) dd.classList.add('open'); });
  dd.addEventListener('mousedown', (e) => {
    const el = e.target.closest('.wp-ac-item'); if (!el) return;
    const it = (dd._items || [])[Number(el.getAttribute('data-idx'))];
    if (!it) return;
    w.label = it.label; w.lat = it.lat; w.lng = it.lng;
    inp.value = it.label;
    dd.classList.remove('open');
    updatePlanBtn();
    drawMarkers();
  });
  const clr = document.querySelector('.wp-clear[data-id="'+w.id+'"]');
  if (clr) clr.addEventListener('click', () => removeWaypoint(w.id));
}

function updatePlanBtn(){
  const filled = waypoints.filter(w => (w.label || '').trim().length >= 2).length;
  document.getElementById('planBtn').disabled = filled < 2;
}

function addWaypoint(){
  waypoints.splice(waypoints.length - 1, 0, { id: nid(), label:'', lat:null, lng:null });
  render();
}
function removeWaypoint(id){
  const i = waypoints.findIndex(w => w.id === id);
  if (i <= 0 || i >= waypoints.length-1) return; // csak köztespont
  waypoints.splice(i, 1);
  render();
  drawMarkers();
}
function resetAll(){
  waypoints = [ { id: nid(), label:'', lat:null, lng:null }, { id: nid(), label:'', lat:null, lng:null } ];
  render();
  if (routeLayer){ map.removeLayer(routeLayer); routeLayer = null; }
  markerLayer.clearLayers();
  document.getElementById('bottomPanel').classList.remove('show');
  document.getElementById('err').style.display = 'none';
  map.setView([46.5, 20.0], 5);
}

function drawMarkers(){
  markerLayer.clearLayers();
  waypoints.forEach((w, i) => {
    if (w.lat == null || w.lng == null) return;
    const pin = i===0 ? '🟢' : (i===waypoints.length-1 ? '🔴' : '🟡');
    L.marker([w.lat, w.lng], { title: w.label,
      icon: L.divIcon({ className:'', html: '<div style="font-size:26px;line-height:26px;transform:translate(-13px,-24px);">'+pin+'</div>', iconSize:[26,26] })
    }).addTo(markerLayer);
  });
}

async function planRoute(){
  document.getElementById('err').style.display = 'none';
  document.getElementById('bottomPanel').classList.remove('show');
  const pts = waypoints.map(w => ({ label: w.label, lat: w.lat, lng: w.lng })).filter(p => (p.label||'').trim().length >= 2 || (p.lat!=null && p.lng!=null));
  if (pts.length < 2){ showErr('Sunt necesare cel puțin 2 puncte.'); return; }

  document.getElementById('spin').classList.add('on');
  const btn = document.getElementById('planBtn'); btn.disabled = true;
  try {
    const r = await gas('rpPlanRoute', { waypoints: pts });
    if (!r.ok){ showErr(r.err || 'Eroare necunoscută'); return; }

    if (routeLayer) map.removeLayer(routeLayer);
    routeLayer = L.polyline(r.polyline, { color:'#4f46e5', weight:5, opacity:0.85 }).addTo(map);

    if (Array.isArray(r.waypoints)){
      r.waypoints.forEach((p, i) => {
        if (waypoints[i]) { waypoints[i].lat = p.lat; waypoints[i].lng = p.lng; waypoints[i].label = p.label || waypoints[i].label; }
      });
      render();
    }
    drawMarkers();

    if (r.bounds){
      map.fitBounds([[r.bounds.minLat, r.bounds.minLng], [r.bounds.maxLat, r.bounds.maxLng]], { padding: [40, 40] });
    }

    // KPI-k
    document.getElementById('kpiKm').textContent = (r.totalKm||0).toFixed(1) + ' km';
    const h = Math.floor((r.durationMin||0) / 60), m = (r.durationMin||0) % 60;
    document.getElementById('kpiTime').textContent = (h ? h + ' h ' : '') + m + ' min';
    document.getElementById('kpiToll').textContent = ((r.toll && r.toll.total) || 0).toFixed(2) + ' ' + ((r.toll && r.toll.currency) || 'EUR');
    document.getElementById('kpiPts').textContent = (r.waypoints || pts).length;
    const srcEl = document.getElementById('kpiSrc');
    srcEl.textContent = r.source === 'here' ? 'HERE' : 'OSRM';
    srcEl.className = 'bp-src' + (r.source === 'here' ? '' : ' osrm');

    // Ország-bontás tábla
    const body = document.getElementById('ccBody');
    const ccTable = document.getElementById('ccTable');
    if (r.byCountry && r.byCountry.length){
      body.innerHTML = r.byCountry.map(c =>
        '<tr><td><span class="cc-flag">'+flagEmoji(c.cc)+'</span>'+esc(ccName(c.cc))+'</td>'
        +'<td class="num">'+c.km.toFixed(1)+' km</td>'
        +'<td class="num">'+(c.tollCost||0).toFixed(2)+' '+((r.toll && r.toll.currency)||'EUR')+'</td></tr>'
      ).join('');
      ccTable.style.display = '';
    } else {
      ccTable.style.display = 'none';
    }

    const note = document.getElementById('infoNote');
    if (r.noHereKey){
      note.textContent = 'ℹ️ Nu există cheie HERE configurată — traseul e din OSRM, fără detaliere pe țară și fără taxă. Contactează developer-ul pentru a activa HERE.';
      note.style.display = '';
    } else if (r.hereError){
      note.textContent = '⚠️ HERE indisponibil (' + r.hereError + ') — s-a folosit OSRM fără taxă/țară.';
      note.style.display = '';
    } else {
      note.style.display = 'none';
    }
    document.getElementById('bottomPanel').classList.add('show');
  } catch (e) {
    showErr(e.message || 'Eroare');
  } finally {
    document.getElementById('spin').classList.remove('on');
    updatePlanBtn();
  }
}

function showErr(m){
  const el = document.getElementById('err');
  el.textContent = m; el.style.display = '';
}

render();
</script>
</body>
</html>
