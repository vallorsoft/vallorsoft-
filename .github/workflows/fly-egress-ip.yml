name: Fly.io — Egress IP allocate

# EGYSZERI kézi workflow a CargoTrack IP-alapú hozzáférés-védelméhez:
# dedikált kimenő (egress) IPv4 + IPv6 allokálása a `vallorsoft` app
# minden gépére, hogy a CargoTrack API-t stabil IP-ről hívjuk.
#
# HASZNÁLAT (mobilról):
#  1) GitHub → Actions fül → bal oldalon „Fly.io — Egress IP allocate"
#  2) „Run workflow" gomb → mode: „list" (először csak listáz, nem allokál)
#  3) Ha a lista üres → futtasd újra „allocate" módban
#  4) Az utolsó lépés (📤 Küldendő adatok a CargoTrack-nek) log-ja
#     tartalmazza a kimásolható IPv4/IPv6 sorokat
#
# Költség: dedikált egress IPv4 ≈ $2/hó/gép, az IPv6 ingyen.
# min_machines_running=1 → 1 gép → 1 × $2/hó.
#
# A workflow SEMMIT nem push-ol vissza a repo-ba, csak a Fly API-t hívja
# a meglévő FLY_API_TOKEN secrettel. Manuális trigger — nem fut push-ra.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'list = csak listázza a jelenlegi egress IP-ket | allocate = allokál minden géphez'
        required: true
        default: 'list'
        type: choice
        options:
          - list
          - allocate

jobs:
  egress-ip:
    name: Fly egress IP művelet
    runs-on: ubuntu-latest

    steps:
      - name: 🛫 flyctl telepítés
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: 🔍 Token ellenőrzés
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::A FLY_API_TOKEN secret nincs beállítva. Repo → Settings → Secrets → Actions."
            exit 1
          fi
          echo "✓ FLY_API_TOKEN elérhető."

      - name: 📋 Gépek listája (vallorsoft)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "=== fly machine list -a vallorsoft ==="
          flyctl machine list -a vallorsoft

      - name: 🌐 Jelenlegi egress IP-k listája
        id: current
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "=== fly machine egress-ip list -a vallorsoft ==="
          flyctl machine egress-ip list -a vallorsoft || true

      - name: ⚡ Egress IP allokálás minden gépre
        if: ${{ inputs.mode == 'allocate' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -e
          echo "=== gép-ID-k lekérése ==="
          MACHINES=$(flyctl machine list -a vallorsoft --json | jq -r '.[].id')
          if [ -z "$MACHINES" ]; then
            echo "::error::Nincs futó gép a vallorsoft app-hoz."
            exit 1
          fi
          for MID in $MACHINES; do
            echo ""
            echo "=== Allokálás géphez: $MID ==="
            # --yes: no interaktív prompt; egyszerre v4+v6 jön
            flyctl machine egress-ip allocate "$MID" -a vallorsoft --yes
          done

      - name: 🔁 Egress IP-k UTÁN
        if: ${{ inputs.mode == 'allocate' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "=== fly machine egress-ip list -a vallorsoft (allokálás után) ==="
          flyctl machine egress-ip list -a vallorsoft

      - name: 📤 Küldendő adatok a CargoTrack-nek
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "════════════════════════════════════════════════════════════════"
          echo " CargoTrack válasz-levélhez — kimásolható IP-k"
          echo "════════════════════════════════════════════════════════════════"
          echo ""
          # A `egress-ip list` táblázatos outputjából kiszedjük az IP-oszlopot.
          # Egyszerű grep az IPv4 és IPv6 mintákra.
          RAW=$(flyctl machine egress-ip list -a vallorsoft 2>/dev/null || true)
          echo "$RAW"
          echo ""
          echo "--- IPv4 címek ---"
          echo "$RAW" | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | sort -u || echo "(nincs)"
          echo ""
          echo "--- IPv6 címek ---"
          echo "$RAW" | grep -oE '([0-9a-f]{1,4}:){2,}[0-9a-f:]+' | sort -u || echo "(nincs)"
          echo ""
          echo "════════════════════════════════════════════════════════════════"
