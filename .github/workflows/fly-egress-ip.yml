name: Fly.io — Egress IP allocate

# EGYSZERI kézi workflow a CargoTrack IP-alapú hozzáférés-védelméhez:
# APP-scoped static egress IP allokálása a `vallorsoft` app-hoz a `fra`
# régióban, hogy a CargoTrack API-t stabil IP-ről hívjuk.
#
# ⚠️ FONTOS 2026-os változás: a `fly machine egress-ip allocate` (gépenkénti)
# DEPRECATED. Helyette az `fly ips allocate-egress` (app-szintű, régiónkénti)
# a támogatott — 1 IP kiszolgál 64 gépet a régióban, IP-váltás nélkül
# túléli a gép-recreatiot is.
#
# HASZNÁLAT (mobilról):
#  1) GitHub → Actions fül → bal oldalon „Fly.io — Egress IP allocate"
#  2) „Run workflow" gomb → mode: „list" (először csak listáz, nem allokál)
#  3) Ha üres → futtasd újra „allocate" módban
#  4) Az utolsó lépés (📤 Küldendő adatok a CargoTrack-nek) log-ja
#     tartalmazza a kimásolható IPv4/IPv6 sorokat
#
# Költség: app-scoped egress IPv4 = **$3.60/hó/régió** (óra-alapon számolva),
# az IPv6 ingyen jár mellé. A vallorsoft app-nak 2 gépe van `fra` régióban →
# 1 IP kiszolgálja mindkettőt → 1 × $3.60/hó.
#
# A workflow SEMMIT nem push-ol vissza a repo-ba, csak a Fly API-t hívja
# a meglévő FLY_API_TOKEN secrettel. Manuális trigger — nem fut push-ra.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'list = csak listázza a jelenlegi egress IP-ket | allocate = allokál a fra régióra'
        required: true
        default: 'list'
        type: choice
        options:
          - list
          - allocate
      region:
        description: 'Fly régió-kód (alap: fra — a vallorsoft app tényleges régiója)'
        required: false
        default: 'fra'
        type: string

jobs:
  egress-ip:
    name: Fly egress IP művelet
    runs-on: ubuntu-latest

    steps:
      - name: 🛫 flyctl telepítés
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: 🔍 Token ellenőrzés
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::A FLY_API_TOKEN secret nincs beállítva. Repo → Settings → Secrets → Actions."
            exit 1
          fi
          echo "✓ FLY_API_TOKEN elérhető."

      - name: 📋 Gépek listája (vallorsoft)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "=== fly machine list -a vallorsoft ==="
          flyctl machine list -a vallorsoft

      - name: 🌐 Jelenlegi IP-k listája (bejövő + kimenő)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "=== fly ips list -a vallorsoft ==="
          flyctl ips list -a vallorsoft || true
          echo ""
          echo "=== fly ips list --json -a vallorsoft (típusonként szűrve) ==="
          flyctl ips list --json -a vallorsoft || true

      - name: ⚡ App-scoped egress IP allokálás (régióra)
        if: ${{ inputs.mode == 'allocate' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          REGION: ${{ inputs.region }}
        run: |
          set -e
          echo "=== fly ips allocate-egress -a vallorsoft -r $REGION ==="
          # A modern, ajánlott parancs. Egy pár (IPv4 + IPv6) allokálódik
          # a régióra. A régió minden gépe (max 64) ezt fogja használni
          # kifelé menő kapcsolatokhoz.
          flyctl ips allocate-egress -a vallorsoft -r "$REGION" --yes

      - name: 🔁 IP-k UTÁN (verifikálás)
        if: ${{ inputs.mode == 'allocate' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "=== fly ips list -a vallorsoft (allokálás után) ==="
          flyctl ips list -a vallorsoft

      - name: 📤 Küldendő adatok a CargoTrack-nek
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "════════════════════════════════════════════════════════════════"
          echo " CargoTrack válasz-levélhez — kimásolható egress IP-k"
          echo "════════════════════════════════════════════════════════════════"
          echo ""
          # A `fly ips list --json` visszaadja a típust (`type`) is,
          # ami lehet: shared_v4, dedicated_v4, private_v6, egress_v4, egress_v6, stb.
          # A CargoTrack-nek CSAK a kimenő (egress_*) címek kellenek.
          RAW_JSON=$(flyctl ips list --json -a vallorsoft 2>/dev/null || echo '[]')
          echo "Nyers IP-lista (debug):"
          echo "$RAW_JSON" | jq '.'
          echo ""
          echo "--- Egress IPv4 (küldendő) ---"
          echo "$RAW_JSON" | jq -r '.[] | select(.Type == "egress_v4" or .Type == "shared_egress_v4") | .Address' | sort -u \
            || echo "(nincs — futtasd allocate módban!)"
          echo ""
          echo "--- Egress IPv6 (opcionális, ha CargoTrack elfogadja) ---"
          echo "$RAW_JSON" | jq -r '.[] | select(.Type == "egress_v6" or .Type == "shared_egress_v6") | .Address' | sort -u \
            || echo "(nincs)"
          echo ""
          echo "════════════════════════════════════════════════════════════════"
